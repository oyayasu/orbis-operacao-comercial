function refreshDaily(){
  const today=dayString();if(today===s.lastLeadDay)return;
  const last=midnight(s.lastLeadDay||today),current=midnight(today);
  if(Number.isNaN(last.getTime())||last>current){s.lastLeadDay=today;store();return;}
  let workDays=0;
  for(let d=new Date(last.getTime()+86400000);d<=current;d=new Date(d.getTime()+86400000))if(isWorkDay(d))workDays++;
  // Repõe, no máximo, cinco dias úteis ao retornar de uma ausência prolongada.
  const total=Math.min(workDays,5);
  for(let i=0;i<total;i++)addLeads(rand(s.config.dailyMin,s.config.dailyMax),i===total-1);
  if(total===0)s.lastLeadCount=0;
  s.lastLeadDay=today;store();
}

function overview(){return `${heading('Visão geral','Acompanhamento individual · '+dayString())}<div class="grid"><div class="metric"><span>Tentativas</span><strong>${s.calls.length}</strong></div><div class="metric"><span>Contatos atendidos</span><strong>${countAnswered()}</strong></div><div class="metric"><span>Vendas aprovadas / meta</span><strong>${sales()} / ${s.config.goalSales}</strong></div><div class="metric"><span>Faturamento mensal / meta</span><strong style="font-size:19px">${money(salesMoney())} / ${money(s.config.goalRevenue)}</strong></div></div><div class="split" style="margin-top:18px"><div class="panel"><h3>Minha operação</h3><p><b>Operador:</b> ${safe(s.user)} (OP-1042)</p><p><b>Campanha:</b> ${s.campaign==='PF'?'Vendas pessoa física':'Vendas pessoa jurídica'}</p><p><b>Carteira de contatos:</b> ${s.contacts.length}</p><p><b>Contatos adicionados na última distribuição:</b> ${s.lastLeadCount}</p><p><b>Conversão:</b> ${percent(sales(),countAnswered())} · Meta ${s.config.goalConversion}%</p><p><b>Tempo conectado:</b> <span data-session>${fmtSeconds(duration(s.sessionStart))}</span></p><div class="buttons">${btn('Abrir discador','to-discador','small')}${btn('Consultar cliente','to-crm','secondary small')}</div></div><div class="panel"><h3>Jornada de trabalho</h3><p><b>Horário:</b> 09h às 15h20</p><p><b>Regime:</b> segunda a sexta</p><p><b>Pausas:</b> 2 × 10 min + 20 min alimentação</p><p><b>Status:</b> ${statusPill(s.status)}</p><p class="muted smalltext">Os cronômetros registram o tempo real de sessão e das chamadas.</p></div></div><div class="panel"><h3>Últimas ocorrências</h3>${events()}</div>`;}

function dialer(){const active=customer(s.current),queue=s.contacts.filter(eligible).length,work=!!s.current;return `${heading('Discador','Operação ativa · telefone e disponibilidade do agente')}<div class="grid"><div class="metric"><span>Ramal</span><strong style="font-size:17px">${safe(s.status)}</strong></div><div class="metric"><span>Registros elegíveis</span><strong>${queue}</strong></div><div class="metric"><span>Tentativas realizadas</span><strong>${s.calls.length}</strong></div><div class="metric"><span>Tempo em ligação</span><strong data-call-time>${fmtSeconds(duration(s.callStart))}</strong></div></div><div class="split" style="margin-top:18px"><div class="panel"><h3>Controle de chamadas</h3><div class="field"><label for="campaign">Campanha em execução</label><select id="campaign" ${work||dialing?'disabled':''}><option value="PF" ${s.campaign==='PF'?'selected':''}>PF — Vendas de serviços pessoais</option><option value="PJ" ${s.campaign==='PJ'?'selected':''}>PJ — Soluções empresariais</option></select></div><div class="buttons">${btn('Iniciar discagem','start','small',dialing||work)}${btn('Parar discagem','stop','secondary small',!dialing)}${btn('Próximo registro','next','secondary small',dialing||work||s.status!=='Disponível')}</div><p class="smalltext muted">${s.campaign==='PF'?'Discador progressivo: seleciona automaticamente o próximo contato quando houver disponibilidade.':'Campanha empresarial: você pode selecionar o próximo contato antes da ligação.'}</p><div class="buttons">${btn('Ficar disponível','available','secondary small',work||s.status==='Disponível')}${btn('Indisponível','unavailable','secondary small',work||s.status==='Indisponível')}</div><h4>Pausas de jornada</h4><div class="buttons">${btn('Descanso 10 min','pause10','secondary small',work)}${btn('Alimentação 20 min','pause20','secondary small',work)}${btn('Pausa pessoal','pausePersonal','secondary small',work)}${btn('Retornar','resume','secondary small',work||!s.status.startsWith('Pausa'))}</div><p class="muted smalltext">Pausa atual: <span data-phase-time>${s.status.startsWith('Pausa')?fmtSeconds(duration(s.phaseStart)):'00:00:00'}</span></p></div><div class="panel"><h3>Painel da chamada</h3>${active?`<div class="call"><span class="pill orange">${s.callPhase==='dialing'?'Chamando...':'Contato conectado'}</span><div class="callring">${safe(active.name)}</div><div>${safe(active.phone)} · ${safe(active.city)}/${safe(active.state)}</div><div><b>Tempo:</b> <span data-call-time>${fmtSeconds(duration(s.callStart))}</span></div></div>${s.callPhase==='connected'?`<p class="notice">${safe(greeting(active))}</p><div class="field"><label for="callResult">Classificação do contato</label><select id="callResult">${['Sem interesse','Retornar','Proposta enviada','Venda realizada','Não deseja contato','Número incorreto'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="callNote">Observações</label><textarea id="callNote" placeholder="Registre objeções, solicitações e encaminhamentos"></textarea></div><div class="buttons">${btn('Finalizar ligação e tabular','finish','small')}${btn('Abrir ficha do contato','open-current','secondary small')}</div>`:''}`:s.status==='Pós-atendimento'?`<div class="notice">Classificação registrada. O próximo contato será liberado em <b><span data-wrap>${remainingWrap()}</span>s</b>.</div>${btn('Concluir pós-atendimento','resume-wrap','small')}`:`<div class="empty"><h3>${dialing?'Localizando próximo contato...':'Sem chamada ativa'}</h3><p>${dialing?'O discador está processando a campanha.':'Inicie a discagem ou selecione um próximo registro.'}</p></div>`}</div></div><div class="panel"><h3>Últimas tentativas</h3>${s.calls.slice(-6).reverse().map(c=>`<div class="timeline"><b>${safe(c.name)} · ${safe(c.result)}</b><span class="muted">${dt(c.at)} · ${fmtSeconds(c.duration)}</span></div>`).join('')||'<div class="empty">Nenhuma tentativa registrada.</div>'}</div>`;}

function commercial(){const catalog=s.products.filter(p=>p.type===s.campaign),contacts=s.contacts.filter(c=>c.type===s.campaign);return `${heading('Vendas e propostas','Produtos, preços, negociações e aprovação de contratos')}<div class="grid"><div class="metric"><span>Propostas</span><strong>${s.orders.length}</strong></div><div class="metric"><span>Vendas aprovadas</span><strong>${sales()}</strong></div><div class="metric"><span>Taxa de conversão</span><strong>${percent(sales(),countAnswered())}</strong></div><div class="metric"><span>Mensalidade aprovada</span><strong style="font-size:18px">${money(salesMoney())}</strong></div></div><div class="split" style="margin-top:18px"><div class="panel"><h3>Nova proposta — ${s.campaign}</h3><form id="orderForm"><div class="field"><label for="orderContact">Cliente</label><select id="orderContact">${contacts.map(c=>`<option value="${c.id}" ${c.id===s.selected?'selected':''}>${safe(c.name)}</option>`).join('')}</select></div><div class="field"><label for="product">Produto</label><select id="product">${catalog.map(p=>`<option value="${safe(p.id)}">${safe(p.name)} · ${money(p.price)}</option>`).join('')}</select></div>${field('Desconto (%)','discount','0','number','min="0" max="100" step="1" required')}<div class="field"><label for="orderNote">Condições e observações</label><textarea id="orderNote" required placeholder="Ex.: cliente aceitou preço, solicita ativação"></textarea></div><button class="button" type="submit">Registrar proposta</button></form><p class="smalltext muted">Propostas acima da alçada ficam aguardando aprovação.</p></div><div class="panel"><h3>Ofertas disponíveis</h3><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Mensalidade</th><th>Alçada</th></tr></thead><tbody>${catalog.map(p=>`<tr><td>${safe(p.name)}</td><td>${money(p.price)}</td><td>${p.discount}%</td></tr>`).join('')}</tbody></table></div><div class="buttons" style="margin-top:18px">${btn('Editar catálogo e metas','to-gestao','secondary small')}</div></div></div><div class="panel"><h3>Histórico de propostas</h3><div class="tablewrap"><table><thead><tr><th>Registro</th><th>Cliente</th><th>Produto</th><th>Valor</th><th>Status</th><th>Gerenciar</th></tr></thead><tbody>${s.orders.slice().reverse().map(o=>`<tr><td>PV-${o.id}</td><td>${safe(o.name)}</td><td>${safe(o.product)}</td><td>${money(o.price)}</td><td>${statusPill(o.status)}</td><td>${o.status!=='Aprovada'&&o.status!=='Cancelada'?btn('Aprovar','approve:'+o.id,'secondary small'):o.status==='Aprovada'?btn('Cancelar','cancel:'+o.id,'secondary small'):''}</td></tr>`).join('')||'<tr><td colspan="6">Nenhuma proposta registrada</td></tr>'}</tbody></table></div></div>`;}

p.id,p.name,'text','required maxlength="65"')}${field('Mensalidade (R$)','pp-'+p.id,p.price,'number','min="0" step="0.01" required')}${field('Alçada desconto (%)','pd-'+p.id,p.discount,'number','min="0" max="100" required')}</div><button class="button secondary small" type="submit">Salvar ${safe(p.id)}</button></form>`).join('')}<p class="muted smalltext">Alterações de preço valem para novas propostas. Propostas antigas mantêm o valor registrado.</p></div></div>`;}

function render(){app.innerHTML=s.logged?shell():login();bind();tickDisplays();}
function cancelTimer(){if(pending)clearTimeout(pending);pending=null;}
function startDialer(){if(s.current||s.status.startsWith('Pausa'))return;dialing=true;s.status='Disponível';message='';log('Discador','Campanha iniciada');store();render();scheduleCall(700);}
function stopDialer(){dialing=false;cancelTimer();if(s.status==='Discando'){s.current=null;s.callPhase='';s.callStart=null;s.status='Indisponível';}else if(s.status==='Disponível')s.status='Indisponível';log('Discador','Campanha interrompida');store();render();}
function pickNext(){return s.contacts.filter(eligible).sort((a,b)=>a.attempts-b.attempts||a.id-b.id)[0]||null;}
function scheduleCall(ms=900){cancelTimer();if(!dialing||s.current||s.status!=='Disponível')return;pending=setTimeout(()=>{pending=null;beginAttempt();},ms);}
function beginAttempt(){if(s.current||s.status!=='Disponível')return;if(!dialing)dialing=true;const c=pickNext();if(!c){dialing=false;s.status='Indisponível';show('Não há contatos elegíveis neste momento. Confira o mailing ou a próxima distribuição.');return;}
  s.current=c.id;s.selected=c.id;s.callPhase='dialing';s.callStart=new Date().toISOString();s.status='Discando';c.attempts++;store();render();cancelTimer();pending=setTimeout(()=>finishAttempt(),s.config.ringSeconds*1000);
}
function finishAttempt(){pending=null;if(s.callPhase!=='dialing')return;const c=customer(s.current);if(!c)return;const r=Math.random()*100;
  if(r<s.config.answerRate){s.status='Em chamada';s.callPhase='connected';s.callStart=new Date().toISOString();log('Ligação',`Contato atendido: ${c.name}`);store();render();return;}
  const result=choice(['Não atendeu','Não atendeu','Ocupado','Caixa postal']);saveCall(c,false,result,'Tentativa automática');c.nextAttemptAt=new Date(Date.now()+rand(90,240)*60000).toISOString();s.current=null;s.callPhase='';s.callStart=null;s.status=dialing?'Disponível':'Indisponível';store();render();if(dialing)scheduleCall(rand(900,1600));
}
function saveCall(c,answered,result,note){const record={id:Date.now()+rand(0,999),at:new Date().toISOString(),name:c.name,contactId:c.id,type:c.type,answered,result,duration:Math.max(1,Math.round(duration(s.callStart))),note};s.calls.push(record);c.status=result;c.history.push({at:record.at,result,note});c.notes=note||c.notes;
  if(['Não deseja contato','Número incorreto'].includes(result))c.blocked=true;
  if(result==='Retornar')c.nextAttemptAt=new Date(Date.now()+24*3600000).toISOString();
  if(result==='Sem interesse')c.nextAttemptAt=new Date(Date.now()+7*86400000).toISOString();
  if(result==='Proposta enviada'||result==='Venda realizada')c.nextAttemptAt=null;
}
function finishCall(){const c=customer(s.current);if(!c||s.callPhase!=='connected')return;const result=document.getElementById('callResult').value,note=document.getElementById('callNote').value.trim();saveCall(c,true,result,note);s.current=null;s.callStart=null;s.callPhase='';s.phaseStart=new Date().toISOString();s.status='Pós-atendimento';log('TPA',`Pós-atendimento: ${c.name}`);store();render();if(dialing&&s.config.autoNext){cancelTimer();pending=setTimeout(resumeWrap,s.config.wrapSeconds*1000);}}
function resumeWrap(){cancelTimer();if(s.status!=='Pós-atendimento')return;s.status='Disponível';s.phaseStart=null;store();render();if(dialing)scheduleCall(900);}
function downloadFile(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function handle(action){
  if(action.startsWith('to-')){tab=action.slice(3);message='';render();return;}
  if(action==='logout'){stopDialer();s.logged=false;s.status='Deslogado';s.sessionStart=null;store();render();return;}
  if(action==='start')return startDialer();
  if(action==='stop')return stopDialer();
  if(action==='next'){s.status='Disponível';return beginAttempt();}
  if(action==='available'){s.status='Disponível';store();render();return;}
  if(action==='unavailable'){if(dialing)stopDialer();s.status='Indisponível';store();render();return;}
  if(action.startsWith('pause')){dialing=false;cancelTimer();s.status=action==='pause10'?'Pausa descanso':action==='pause20'?'Pausa alimentação':'Pausa pessoal';s.phaseStart=new Date().toISOString();log('Pausa',s.status);store();render();return;}
  if(action==='resume'){s.status='Disponível';s.phaseStart=null;log('Retorno','Disponível para discagem');store();render();return;}
  if(action==='finish')return finishCall();
  if(action==='resume-wrap')return resumeWrap();
  if(action==='open-current'){s.selected=s.current;tab='crm';render();return;}
  if(action==='save-note'){const c=customer(s.selected);if(c){c.notes=document.getElementById('crmNote').value.trim();c.history.push({at:new Date().toISOString(),result:'Observações atualizadas',note:c.notes});store();show('Ficha atualizada.');}return;}
  if(action==='block'){const c=customer(s.selected);if(c){c.blocked=!c.blocked;c.status=c.blocked?'Não deseja contato':'Pendente';c.history.push({at:new Date().toISOString(),result:c.blocked?'Contato bloqueado':'Contato desbloqueado',note:'Alteração de preferência'});store();render();}return;}
  if(action==='generate-leads'){const qty=rand(s.config.dailyMin,s.config.dailyMax);addLeads(qty);show(`Mailing atualizado: ${qty} novos contatos distribuídos.`);return;}
  if(action.startsWith('approve:')||action.startsWith('cancel:')){const id=Number(action.split(':')[1]),o=s.orders.find(x=>x.id===id);if(o){o.status=action.startsWith('approve')?'Aprovada':'Cancelada';const c=customer(o.contactId||o.contact);if(c)c.status=o.status==='Aprovada'?'Venda realizada':'Proposta cancelada';store();render();}return;}
  if(action==='export'){const rows=[['Data','Cliente','Segmento','Resultado','Duração (s)'],...s.calls.map(c=>[c.at,c.name,c.type,c.result,c.duration])];const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadFile('orbis_relatorio.csv',csv,'text/csv;charset=utf-8');return;}
  if(action==='backup'){downloadFile('orbis_backup.json',JSON.stringify(s,null,2),'application/json');return;}
  if(action==='reset'){if(confirm('Limpar registros, chamadas e propostas deste dispositivo?')){stopDialer();const user=s.user;s=startState();s.user=user;initLeads();s.logged=true;s.sessionStart=new Date().toISOString();s.status='Indisponível';store();tab='painel';render();}return;}
}
function bind(){
  app.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{tab=el.dataset.tab;message='';render();}));
  app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>handle(el.dataset.action)));
  app.querySelectorAll('[data-contact]').forEach(el=>el.addEventListener('click',()=>{s.selected=Number(el.dataset.contact);store();render();}));
  document.getElementById('crmSearch')?.addEventListener('change',e=>{search=e.target.value;render();});
  document.getElementById('crmType')?.addEventListener('change',e=>{crmType=e.target.value;render();});
  document.getElementById('campaign')?.addEventListener('change',e=>{s.campaign=e.target.value;store();render();});
  document.getElementById('loginForm')?.addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('username').value.trim();if(!name)return;const pwd=document.getElementById('pwd').value;if(pwd!=='123456')return show('Senha inválida. Verifique a credencial de acesso.');s.user=name;s.logged=true;s.status='Indisponível';s.session++;s.sessionStart=new Date().toISOString();initLeads();refreshDaily();log('Acesso',`Sessão iniciada: ${name}`);store();message='';render();});
  document.getElementById('profileForm')?.addEventListener('submit',e=>{e.preventDefault();s.user=document.getElementById('newname').value.trim()||s.user;store();show('Nome atualizado.');});
  document.getElementById('orderForm')?.addEventListener('submit',e=>{e.preventDefault();const c=customer(document.getElementById('orderContact').value),p=s.products.find(x=>x.id===document.getElementById('product').value),discount=Number(document.getElementById('discount').value),note=document.getElementById('orderNote').value.trim();if(!c||!p||!Number.isFinite(discount)||discount<0||discount>100||!note)return show('Verifique os campos da proposta.');const status=discount>p.discount?'Aguardando aprovação':'Registrada';const order={id:Date.now(),contactId:c.id,name:c.name,product:p.name,price:Number((p.price*(1-discount/100)).toFixed(2)),discount,status,at:new Date().toISOString(),note};s.orders.push(order);c.status='Proposta enviada';c.history.push({at:order.at,result:'Proposta '+status,note:`${p.name}: ${money(order.price)}. ${note}`});store();show('Proposta PV-'+order.id+' registrada.');});
  document.getElementById('settingsForm')?.addEventListener('submit',e=>{e.preventDefault();const v=id=>Number(document.getElementById(id).value);const min=v('cfgDailyMin'),max=v('cfgDailyMax');if(min>max)return show('O mínimo diário não pode superar o máximo.');s.config={...s.config,goalSales:v('cfgGoalSales'),goalRevenue:v('cfgGoalRevenue'),goalConversion:v('cfgGoalConversion'),pfShare:v('cfgPfShare'),dailyMin:min,dailyMax:max,ringSeconds:v('cfgRingSeconds'),wrapSeconds:v('cfgWrapSeconds'),answerRate:v('cfgAnswerRate'),autoNext:document.getElementById('cfgAutoNext').checked};store();show('Parâmetros atualizados.');});
  app.querySelectorAll('form.productEdit').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const p=s.products.find(x=>x.id===form.dataset.product);if(p){p.name=document.getElementById('pn-'+p.id).value.trim();p.price=Number(document.getElementById('pp-'+p.id).value);p.discount=Number(document.getElementById('pd-'+p.id).value);store();show('Produto '+p.id+' atualizado.');}}));
}
function tickDisplays(){if(!app)return;
  app.querySelectorAll('[data-clock]').forEach(el=>el.textContent=new Date().toLocaleTimeString('pt-BR'));
  app.querySelectorAll('[data-session]').forEach(el=>el.textContent=fmtSeconds(duration(s.sessionStart)));
  app.querySelectorAll('[data-call-time]').forEach(el=>el.textContent=fmtSeconds(duration(s.callStart)));
  app.querySelectorAll('[data-wrap]').forEach(el=>el.textContent=String(remainingWrap()));
  app.querySelectorAll('[data-phase-time]').forEach(el=>el.textContent=fmtSeconds(duration(s.phaseStart)));
}
setInterval(()=>{tickDisplays();if(s.logged&&dayString()!==s.lastLeadDay){refreshDaily();if(['painel','crm','gestao'].includes(tab))render();}},1000);
render();
</script></body></html>
