<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Orbis | Operação comercial</title><style>:root{font-family:Inter,'Segoe UI',Arial,sans-serif;color:#18283e;background:#f3f5f8;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}input,select,textarea{padding:10px 12px;border:1px solid #cfd7e2;border-radius:7px;background:white;color:#18283e;width:100%}textarea{resize:vertical;min-height:76px}.button{background:#20529d;color:white;border:1px solid #20529d;padding:10px 14px;border-radius:7px;font-weight:600}.button.secondary{color:#234875;background:white;border-color:#cbd6e4}.button.danger{background:#a83939;border-color:#a83939}.button.small{padding:7px 10px;font-size:12px}.button.full{width:100%}.muted{color:#6d7a8c}.smalltext{font-size:12px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#e7edf5,#f6f8fb)}.loginbox{background:white;width:min(440px,calc(100vw - 30px));padding:34px;border:1px solid #dfe5ee;border-radius:12px;box-shadow:0 18px 60px #12305817}.logo{font-weight:800;letter-spacing:-.5px;font-size:23px;color:#1e477e}.logo small{display:block;font-size:11px;letter-spacing:2px;color:#8390a3;font-weight:700}.field{display:grid;gap:5px;margin:14px 0}.field label{font-size:12px;font-weight:700;color:#52647b}.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{background:#162b46;color:#dae3ef;padding:20px 13px;display:flex;flex-direction:column;gap:18px}.sidebar .logo{color:white;padding:7px}.navbtn{display:block;width:100%;padding:12px 11px;text-align:left;background:transparent;color:#c8d4e2;border:0;border-radius:7px;margin:3px 0}.navbtn:hover,.navbtn.active{background:#284766;color:white}.sidefoot{margin-top:auto;padding:10px;background:#233c59;border-radius:8px;font-size:12px;line-height:1.7}.topbar{height:75px;border-bottom:1px solid #dce3eb;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 25px;gap:15px}.content{padding:24px;max-width:1530px;margin:auto}.heading{font-size:23px;font-weight:750;letter-spacing:-.5px;margin:0 0 5px}.sub{font-size:13px;color:#728094;margin:0 0 22px}.panel{background:white;border:1px solid #dce3ec;border-radius:10px;padding:20px;margin-bottom:17px;box-shadow:0 2px 4px #18355405}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.split{display:grid;grid-template-columns:1.15fr 1fr;gap:17px}.metric{background:#fff;border:1px solid #dce3ec;border-radius:9px;padding:18px}.metric strong{display:block;font-size:26px;margin-top:7px}.metric span{font-size:12px;color:#728094}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.pill{font-size:11px;font-weight:700;padding:5px 9px;border-radius:15px;background:#ebf0fa;color:#365d9f;display:inline-block}.pill.green{background:#e5f4e9;color:#217b45}.pill.orange{background:#fff0d8;color:#9b6013}.pill.red{background:#fce8e8;color:#a32f38}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px;border-bottom:1px solid #e7ebf1;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#718198;background:#f8f9fb}tr[data-click]{cursor:pointer}tr[data-click]:hover{background:#f1f6ff}h3{font-size:16px;margin:0 0 14px}h4{margin:10px 0}.banner{padding:13px;background:#edf4ff;border:1px solid #d1e0fb;border-radius:8px;margin-bottom:15px;color:#31598d}.buttons{display:flex;flex-wrap:wrap;gap:8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.timeline{border-left:2px solid #dae4ef;padding:0 0 14px 15px;margin-left:5px;font-size:13px}.timeline b{display:block;margin-bottom:4px}.empty{padding:24px;text-align:center;color:#8490a1}.role{font-size:12px;background:#27415f;padding:6px 10px;border-radius:4px}.call{border:1px solid #c8d9f0;background:#f2f7fe;border-radius:10px;padding:18px}.callring{font-size:22px;font-weight:750;margin:6px 0}.error{color:#ae3434}.notice{font-size:12px;background:#fff5e7;padding:10px;border-radius:6px;color:#8b651e}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{display:block}.sidebar nav{display:flex;overflow-x:auto}.navbtn{white-space:nowrap;width:auto}.sidefoot{display:none}.topbar{height:auto;padding:12px}.content{padding:15px}.formgrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><script type="module">
const KEY='orbis_simulador_v1';
const baseContacts=[
{id:1001,name:'Mariana Oliveira',type:'PF',phone:'(19) 98871-4201',city:'Campinas',interest:'Plano móvel',notes:'Cliente mencionou interesse em reduzir a conta.',status:'Pendente',attempts:0,blocked:false,history:[]},
{id:1002,name:'Carlos Ferreira',type:'PF',phone:'(11) 98450-1262',city:'São Paulo',interest:'Internet residencial',notes:'Sem informações anteriores.',status:'Pendente',attempts:0,blocked:false,history:[]},
{id:1003,name:'Papelaria Horizonte LTDA',type:'PJ',phone:'(19) 3428-1074',city:'Campinas',interest:'Internet empresarial',notes:'Responsável: Denise. Solicita contato comercial.',status:'Pendente',attempts:0,blocked:false,history:[]},
{id:1004,name:'Mecânica Dois Irmãos',type:'PJ',phone:'(11) 3459-2064',city:'Jundiaí',interest:'Telefonia empresarial',notes:'Pequena empresa. Responsável: Ricardo.',status:'Pendente',attempts:0,blocked:false,history:[]},
{id:1005,name:'Ana Paula Mendes',type:'PF',phone:'(31) 98862-3100',city:'Belo Horizonte',interest:'Plano família',notes:'Pediu para explicar fidelidade.',status:'Pendente',attempts:0,blocked:false,history:[]},
{id:1006,name:'Mercado Nova Estação ME',type:'PJ',phone:'(19) 3402-5682',city:'Sumaré',interest:'Internet empresarial',notes:'Atendimento anterior sem proposta.',status:'Pendente',attempts:0,blocked:false,history:[]},
{id:1007,name:'Rafael Barbosa',type:'PF',phone:'(21) 98144-2040',city:'Rio de Janeiro',interest:'Plano móvel',notes:'Contato de campanha comercial.',status:'Pendente',attempts:0,blocked:false,history:[]},
{id:1008,name:'Estúdio Via Norte LTDA',type:'PJ',phone:'(11) 3220-7911',city:'São Paulo',interest:'Telefonia empresarial',notes:'Solicitar contato com setor administrativo.',status:'Pendente',attempts:0,blocked:false,history:[]}
];
const products=[{id:'PF01',type:'PF',name:'Móvel Essencial',price:49.90,discount:10},{id:'PF02',type:'PF',name:'Móvel Plus',price:69.90,discount:10},{id:'PF03',type:'PF',name:'Família 3 linhas',price:119.90,discount:5},{id:'PJ01',type:'PJ',name:'Internet Empresarial 500 Mb',price:149.90,discount:10},{id:'PJ02',type:'PJ',name:'Voz Empresa 4 linhas',price:179.90,discount:10}];
const seed=()=>({user:'',logged:false,role:'Operador',campaign:'PF',status:'Deslogado',contacts:structuredClone(baseContacts),calls:[],orders:[],notes:{},current:null,callStart:null,callPhase:'',attempts:0,pauseEvents:[],session:0,sessionStart:null,selected:1001});
function read(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.contacts)&&Array.isArray(x.calls)&&Array.isArray(x.orders))return {...seed(),...x,logged:false,status:'Deslogado',current:null,callPhase:'',callStart:null}}catch{}return seed()}
let s=read(),tab='painel',notice='',timer=null;
const app=document.getElementById('app');
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=v=>new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const clock=()=>new Date().toLocaleTimeString('pt-BR');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...s,logged:false,status:'Deslogado',current:null,callPhase:'',callStart:null}));return true}catch{notice='Não foi possível gravar os dados locais. Verifique o espaço disponível.';return false}};
const contact=id=>s.contacts.find(c=>c.id===Number(id));
const statLabel=()=>s.status==='Em chamada'?'Em atendimento':s.status;
const btn=(label,act,kind='secondary',disabled=false)=>`<button class="button ${kind}" data-action="${act}" ${disabled?'disabled':''}>${label}</button>`;
function formField(label,key,value='',type='text',extra=''){return `<div class="field"><label for="${key}">${label}</label><input id="${key}" ${extra} type="${type}" value="${safe(value)}"></div>`}
function stamp(type,details=''){s.pauseEvents.unshift({type,details,at:new Date().toISOString()});s.pauseEvents=s.pauseEvents.slice(0,150)}
function loginPage(){return `<div class="login"><div class="loginbox"><div class="logo">ORBIS<small>OPERAÇÃO COMERCIAL · DEMONSTRAÇÃO</small></div><h2>Entrar na operação</h2><p class="muted">Ambiente fictício de treinamento. Não exige cadastro real nem conexão com telefonia.</p>${notice?`<p class="error">${safe(notice)}</p>`:''}<form id="loginForm">${formField('Nome de exibição','username',s.user,'text','required maxlength="50" placeholder="Digite seu nome"')}${formField('Identificação de operador (fictícia)','operator','OP-1042','text','readonly')}<div class="field"><label for="pwd">Senha demonstrativa</label><input type="password" id="pwd" value="123456" required></div><button class="button full" type="submit">Iniciar sessão</button></form><p class="smalltext muted">Senha fictícia: 123456. O nome informado aparecerá na interface e poderá ser editado depois. Dados salvos neste dispositivo.</p></div></div>`}
const tabs=[['painel','Visão geral'],['discador','Discador e telefonia'],['crm','CRM e mailing'],['comercial','Comercial e propostas'],['relatorios','Relatórios'],['perfil','Meu perfil']];
function shell(){return `<div class="shell"><aside class="sidebar"><div class="logo">ORBIS<small>OPERAÇÃO COMERCIAL</small></div><nav>${tabs.map(([id,label])=>`<button class="navbtn ${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</nav><div class="sidefoot"><b>${safe(s.user)}</b><br>Operador OP-1042<br>${safe(s.campaign==='PF'?'Campanha Pessoa Física':'Campanha Pessoa Jurídica')}<br><span class="pill">Treinamento offline</span></div></aside><main><header class="topbar"><div><b>Central de Vendas Ativas</b><div class="muted smalltext">Unidade virtual • ambiente de simulação</div></div><div class="row"><span class="pill ${s.status==='Disponível'?'green':s.status==='Em chamada'?'orange':''}">${safe(statLabel())}</span><span class="smalltext">${safe(s.user)}</span>${btn('Sair','logout','secondary small')}</div></header><section class="content">${notice?`<div class="banner" role="alert">${safe(notice)}</div>`:''}${body()}</section></main></div>`}
function title(h,sub){return `<h1 class="heading">${h}</h1><p class="sub">${sub}</p>`}
const countCalls=(p)=>s.calls.filter(p).length;
function overview(){const calls=countCalls(x=>x.result!=='Em andamento'),sales=s.orders.filter(x=>x.status==='Aprovada').length;return `${title('Visão geral','Painel individual do operador • dados simulados')}<div class="grid"><div class="metric"><span>Tentativas encerradas</span><strong>${calls}</strong></div><div class="metric"><span>Contatos atendidos</span><strong>${countCalls(x=>x.answered)}</strong></div><div class="metric"><span>Vendas aprovadas</span><strong>${sales}</strong></div><div class="metric"><span>Conversão sobre contatos</span><strong>${countCalls(x=>x.answered)?(100*sales/countCalls(x=>x.answered)).toFixed(1)+'%':'—'}</strong></div></div><div class="split" style="margin-top:18px"><div class="panel"><h3>Informações da operação</h3><p><b>Operador:</b> ${safe(s.user)} (OP-1042)</p><p><b>Escala fictícia:</b> segunda a sexta, 09h–15h20</p><p><b>Campanha ativa:</b> ${s.campaign==='PF'?'Vendas de pessoa física':'Vendas de pessoa jurídica'}</p><p><b>Estado atual:</b> ${safe(statLabel())}</p><div class="buttons">${btn('Acessar discador','to-discador')}${btn('Abrir CRM','to-crm')}</div></div><div class="panel"><h3>Orientações ao operador</h3><p>1. Entre na campanha e altere o estado para <b>Disponível</b>.</p><p>2. Inicie a tentativa e registre o resultado da ligação.</p><p>3. Se houver negociação, consulte o cliente no CRM e gere a proposta comercial.</p><div class="notice">Todos os números, clientes, ofertas e resultados deste programa são fictícios. Nenhuma ligação real será realizada.</div></div></div><div class="panel"><h3>Últimas ocorrências</h3>${activity()}</div>`}
function activity(){const all=[...s.calls.map(x=>({type:'Chamada',at:x.at,details:`${x.name} — ${x.result}`})),...s.pauseEvents.map(x=>({type:x.type,at:x.at,details:x.details}))].sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,8);return all.length?all.map(a=>`<div class="timeline"><b>${safe(a.type)} · ${safe(dt(a.at))}</b><span class="muted">${safe(a.details)}</span></div>`).join(''):'<div class="empty">Nenhuma atividade registrada até o momento.</div>'}
function dialer(){const c=contact(s.current);const queued=s.contacts.filter(x=>x.type===s.campaign&&!x.blocked&&x.status!=='Venda realizada');return `${title('Discador e telefonia','Gestão de ramal, campanha, tentativas e pausas')}<div class="grid"><div class="metric"><span>Status do ramal</span><strong style="font-size:19px">${safe(statLabel())}</strong></div><div class="metric"><span>Campanha</span><strong style="font-size:19px">${s.campaign==='PF'?'Vendas PF':'Vendas PJ'}</strong></div><div class="metric"><span>Contatos elegíveis</span><strong>${queued.length}</strong></div><div class="metric"><span>Tentativas registradas</span><strong>${s.calls.length}</strong></div></div><div class="split" style="margin-top:18px"><div class="panel"><h3>Console do agente</h3><div class="field"><label>Campanha em execução</label><select id="campaign" ${s.current?'disabled':''}><option value="PF" ${s.campaign==='PF'?'selected':''}>PF • Planos residenciais e móveis</option><option value="PJ" ${s.campaign==='PJ'?'selected':''}>PJ • Soluções empresariais</option></select></div><div class="buttons">${btn('Ficar disponível','available','secondary small',!!s.current||s.status==='Disponível')}${btn('Iniciar próxima tentativa','call','small',!!s.current||s.status!=='Disponível')}${btn('Encerrar disponibilidade','unavailable','secondary small',!!s.current||s.status==='Indisponível')}</div><h4 style="margin-top:23px">Pausas</h4><div class="buttons">${btn('Descanso 10 min','pause10','secondary small',!!s.current)}${btn('Alimentação 20 min','pause20','secondary small',!!s.current)}${btn('Necessidade pessoal','pausepersonal','secondary small',!!s.current)}${btn('Voltar ao atendimento','resume','secondary small',!!s.current||!s.status.startsWith('Pausa'))}</div><p class="smalltext muted">As pausas são registradas para simulação. Cronômetros e política de jornada são informativos; este protótipo não aplica bloqueios automáticos por duração.</p></div><div class="panel"><h3>Ligação atual</h3>${c?`<div class="call"><span class="pill orange">Chamada conectada (simulada)</span><div class="callring">${safe(c.name)}</div><div>${safe(c.phone)} · ${safe(c.city)} · ${c.type}</div><p><b>Interesse:</b> ${safe(c.interest)}</p><p class="muted">${safe(c.notes)}</p><p><b>Início:</b> ${safe(dt(s.callStart))}</p><div class="buttons">${btn('Abrir cadastro','open-current','secondary small')}${btn('Ir para propostas','to-comercial','secondary small')}</div></div><div class="field"><label>Resultado / tabulação</label><select id="callResult"><option value="Sem interesse">Sem interesse</option><option value="Retorno solicitado">Retorno solicitado</option><option value="Proposta enviada">Proposta enviada</option><option value="Venda realizada">Venda realizada</option><option value="Número incorreto">Número incorreto</option><option value="Não deseja contato">Não deseja contato</option></select></div><div class="field"><label>Observações do atendimento</label><textarea id="callNote" placeholder="Registre informações relevantes da conversa..."></textarea></div>${btn('Encerrar e tabular ligação','finish','primary')}`:`<div class="empty"><h3>Sem ligação ativa</h3><p>A próxima ligação será simulada quando você estiver disponível.</p></div>`}</div></div><div class="panel"><h3>Histórico de ligações</h3>${callsTable()}</div>`}
function callsTable(){return s.calls.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Contato</th><th>Campanha</th><th>Resultado</th><th>Tempo</th></tr></thead><tbody>${s.calls.slice().reverse().slice(0,15).map(c=>`<tr><td>${safe(dt(c.at))}</td><td>${safe(c.name)}</td><td>${c.type}</td><td>${safe(c.result)}</td><td>${c.duration}s</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Não há ligações registradas.</div>'}
function crm(){const c=contact(s.selected)||s.contacts[0];const list=s.contacts.filter(x=>x.type===s.campaign);return `${title('CRM e mailing','Registro de contatos, histórico, tabulação e bloqueio de chamadas')}<div class="split"><div class="panel"><div class="row between"><h3>Carteira de contatos · ${s.campaign}</h3><span class="pill">${list.length} registros</span></div><div class="tablewrap"><table><thead><tr><th>Contato</th><th>Cidade</th><th>Situação</th></tr></thead><tbody>${list.map(x=>`<tr data-click="${x.id}"><td><b>${safe(x.name)}</b><div class="muted smalltext">#${x.id}</div></td><td>${safe(x.city)}</td><td><span class="pill ${x.blocked?'red':''}">${safe(x.status)}</span></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h3>Ficha cadastral</h3>${c?`<p><b>${safe(c.name)}</b> · ${c.type}</p><p class="muted">${safe(c.phone)} · ${safe(c.city)}</p><p><b>Interesse comercial:</b> ${safe(c.interest)}</p><p><b>Tentativas:</b> ${c.attempts} · <b>Situação:</b> ${safe(c.status)}</p><div class="field"><label>Observações do cadastro</label><textarea id="crmNote">${safe(c.notes)}</textarea></div><div class="buttons">${btn('Salvar observações','save-note','small')}${btn(c.blocked?'Remover bloqueio':'Bloquear ofertas','block','secondary small')}</div><h4>Histórico deste cliente</h4>${c.history.length?c.history.slice().reverse().map(h=>`<div class="timeline"><b>${safe(dt(h.at))} — ${safe(h.result)}</b><span class="muted">${safe(h.note)}</span></div>`).join(''):'<div class="empty">Nenhuma interação anterior.</div>'}`:'<p>Nenhum registro selecionado.</p>'}</div></div>`}
function commercial(){const c=contact(s.selected);const catalog=products.filter(x=>x.type===s.campaign);return `${title('Comercial e propostas','Catálogo de produtos fictícios, descontos e registro de pedidos')}<div class="split"><div class="panel"><h3>Nova proposta comercial</h3><form id="orderForm"><div class="field"><label>Cliente</label><select id="orderContact" required>${s.contacts.filter(c=>c.type===s.campaign&&!c.blocked).map(c=>`<option value="${c.id}" ${c.id===s.selected?'selected':''}>${safe(c.name)} (#${c.id})</option>`).join('')}</select></div><div class="field"><label>Produto / serviço</label><select id="product" required>${catalog.map(p=>`<option value="${p.id}">${safe(p.name)} — ${money(p.price)}</option>`).join('')}</select></div><div class="field"><label>Desconto solicitado (%)</label><input type="number" id="discount" value="0" min="0" max="100" step="1" required></div><div class="field"><label>Justificativa comercial</label><textarea id="orderNote" placeholder="Ex.: Cliente comparou preços..." required></textarea></div><button class="button" type="submit">Registrar proposta</button></form><div class="notice" style="margin-top:14px">Regras fictícias: propostas com desconto acima da alçada do operador ficam pendentes de aprovação. Uma proposta não é uma venda aprovada.</div></div><div class="panel"><h3>Catálogo da campanha</h3><div class="tablewrap"><table><thead><tr><th>Código</th><th>Oferta</th><th>Mensalidade</th><th>Alçada</th></tr></thead><tbody>${catalog.map(p=>`<tr><td>${p.id}</td><td>${safe(p.name)}</td><td>${money(p.price)}</td><td>${p.discount}%</td></tr>`).join('')}</tbody></table></div><h4 style="margin-top:26px">Etapas comerciais</h4><p class="muted smalltext">Proposta registrada → Validação → Aprovada ou recusada. Os valores, a elegibilidade e o fluxo são inteiramente fictícios.</p></div></div><div class="panel"><h3>Propostas cadastradas</h3>${s.orders.length?`<div class="tablewrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Produto</th><th>Valor</th><th>Status</th><th>Ação</th></tr></thead><tbody>${s.orders.slice().reverse().map(o=>`<tr><td>PV-${o.id}</td><td>${safe(o.name)}</td><td>${safe(o.product)}</td><td>${money(o.price)}</td><td><span class="pill ${o.status==='Aprovada'?'green':o.status==='Aguardando aprovação'?'orange':''}">${safe(o.status)}</span></td><td>${o.status==='Aguardando aprovação'||o.status==='Registrada'?btn('Validar','approve:'+o.id,'secondary small'):''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma proposta registrada.</div>'}</div>`}
function reports(){return `${title('Relatórios','Resumo operacional individual da simulação')}<div class="grid"><div class="metric"><span>Ligações encerradas</span><strong>${s.calls.length}</strong></div><div class="metric"><span>Chamadas atendidas</span><strong>${countCalls(c=>c.answered)}</strong></div><div class="metric"><span>Propostas geradas</span><strong>${s.orders.length}</strong></div><div class="metric"><span>Receita mensal contratada*</span><strong>${money(s.orders.filter(o=>o.status==='Aprovada').reduce((a,o)=>a+o.price,0))}</strong></div></div><div class="panel" style="margin-top:18px"><h3>Resultados por classificação</h3>${Object.entries(s.calls.reduce((a,c)=>(a[c.result]=(a[c.result]||0)+1,a),{})).map(([k,v])=>`<p><b>${safe(k)}</b>: ${v}</p>`).join('')||'<p class="muted">Nenhum resultado ainda.</p>'}<hr style="border:0;border-top:1px solid #e6ebf1"><p class="muted smalltext">*Simulação, não faturamento ou receita real. Todas as chamadas são geradas localmente.</p>${btn('Exportar relatório CSV','export','secondary small')}</div><div class="panel"><h3>Registros de pausa e sessão</h3>${activity()}</div>`}
function profile(){return `${title('Meu perfil','Dados fictícios de acesso e manutenção local')}<div class="split"><div class="panel"><h3>Identificação do operador</h3><form id="profileForm">${formField('Nome que aparece na operação','newname',s.user,'text','required maxlength="50"')}<p><b>Matrícula:</b> OP-1042</p><p><b>Perfil:</b> Operador comercial</p><p><b>Ambiente:</b> Treinamento offline</p><button type="submit" class="button">Salvar meu nome</button></form></div><div class="panel"><h3>Gerenciamento de dados</h3><p class="muted">Os registros deste protótipo ficam armazenados localmente no perfil desta aplicação ou navegador. Não há servidor, conta de verdade ou envio de dados.</p><div class="buttons">${btn('Exportar cópia JSON','backup','secondary small')}${btn('Apagar simulação','reset','danger small')}</div><p class="notice">O login é apenas representativo. Não utiliza autenticação segura e não deve ser usado com dados verdadeiros de clientes.</p></div></div>`}
function body(){return ({painel:overview,discador:dialer,crm,comercial,relatorios:reports,perfil:profile}[tab]||overview)()}
function render(){app.innerHTML=s.logged?shell():loginPage();bind()}
function changePage(t){tab=t;notice='';render()}
function alertMsg(text){notice=text;render()}
function enterCall(){if(s.current||s.status!=='Disponível')return;const list=s.contacts.filter(c=>c.type===s.campaign&&!c.blocked&&!['Venda realizada','Número incorreto','Não deseja contato'].includes(c.status));if(!list.length)return alertMsg('Nenhum contato elegível nesta campanha.');list.sort((a,b)=>a.attempts-b.attempts||a.id-b.id);const c=list[0];c.attempts++;s.selected=c.id;const tries=['Atendida','Atendida','Atendida','Não atendeu','Caixa postal'];const outcome=tries[(s.calls.length+c.id)%tries.length];if(outcome!=='Atendida'){const rec={at:new Date().toISOString(),id:c.id,name:c.name,type:c.type,answered:false,result:outcome,duration:0};s.calls.push(rec);c.status=outcome;c.history.push({at:rec.at,result:outcome,note:'Tentativa automática simulada.'});save();return alertMsg(`Discagem simulada: ${c.name} — ${outcome}. Próximo contato disponível.`)}s.current=c.id;s.callStart=new Date().toISOString();s.status='Em chamada';s.callPhase='connected';save();render()}
function finishCall(){const c=contact(s.current);if(!c)return;const result=document.querySelector('#callResult')?.value||'Sem interesse';const note=document.querySelector('#callNote')?.value.trim()||'Sem observações.';const at=new Date().toISOString();const duration=Math.max(1,Math.round((Date.now()-new Date(s.callStart).getTime())/1000));s.calls.push({at,id:c.id,name:c.name,type:c.type,answered:true,result,duration,note});c.status=result;if(result==='Não deseja contato'||result==='Número incorreto')c.blocked=true;c.history.push({at,result,note});c.notes=note;s.current=null;s.callStart=null;s.status='Disponível';s.callPhase='';save();alertMsg('Ligação encerrada e tabulada. Registro salvo no CRM.')}
function download(name,data,mime){const b=new Blob([data],{type:mime});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function applyAction(a){if(a.startsWith('approve:')){const o=s.orders.find(x=>x.id===Number(a.split(':')[1]));if(o){o.status='Aprovada';const c=contact(o.contact);if(c)c.status='Venda realizada';save();alertMsg('Proposta validada no ambiente fictício.')}return}if(a==='logout'){s.logged=false;s.status='Deslogado';s.current=null;s.callPhase='';save();return render()}if(a.startsWith('to-'))return changePage(a.slice(3));if(a==='available'){s.status='Disponível';stamp('Status','Disponível para discagem')}if(a==='unavailable'){s.status='Indisponível';stamp('Status','Indisponível para discagem')}if(a==='call')return enterCall();if(a==='open-current'){s.selected=s.current;return changePage('crm')}if(a==='finish')return finishCall();if(a.startsWith('pause')){s.status=a==='pause10'?'Pausa descanso':a==='pause20'?'Pausa alimentação':'Pausa pessoal';stamp('Pausa',s.status)}if(a==='resume'){s.status='Disponível';stamp('Retorno','Retorno à disponibilidade')}if(a==='save-note'){const c=contact(s.selected);if(c){c.notes=document.querySelector('#crmNote').value.trim();c.history.push({at:new Date().toISOString(),result:'Atualização de cadastro',note:c.notes})}save();return alertMsg('Observações atualizadas.')}if(a==='block'){const c=contact(s.selected);if(c){c.blocked=!c.blocked;c.status=c.blocked?'Não deseja contato':'Pendente';c.history.push({at:new Date().toISOString(),result:c.blocked?'Bloqueio de contato':'Remoção de bloqueio',note:'Alteração manual pelo operador'})}save();return render()}if(a==='export'){const lines=[['Data','Cliente','Campanha','Resultado','Duração (segundos)'],...s.calls.map(c=>[c.at,c.name,c.type,c.result,c.duration])];return download('orbis_ligacoes.csv','\uFEFF'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}if(a==='backup')return download('orbis_backup.json',JSON.stringify(s,null,2),'application/json');if(a==='reset'){if(confirm('Apagar todas as ligações, propostas e históricos desta simulação?')){const name=s.user;s=seed();s.user=name;s.logged=true;s.status='Indisponível';tab='painel';save();render()}return}save();render()}
function bind(){app.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>changePage(el.dataset.tab)));app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>applyAction(el.dataset.action)));app.querySelectorAll('[data-click]').forEach(el=>el.addEventListener('click',()=>{s.selected=Number(el.dataset.click);save();render()}));document.querySelector('#campaign')?.addEventListener('change',e=>{s.campaign=e.target.value;const match=s.contacts.find(c=>c.type===s.campaign);if(match)s.selected=match.id;save();render()});document.querySelector('#loginForm')?.addEventListener('submit',e=>{e.preventDefault();const name=document.querySelector('#username').value.trim();if(!name)return;const pwd=document.querySelector('#pwd').value;if(pwd!=='123456')return alertMsg('Senha demonstrativa incorreta. Use 123456.');s.user=name;s.logged=true;s.status='Indisponível';s.session++;s.sessionStart=new Date().toISOString();stamp('Acesso','Sessão iniciada por '+name);save();render()});document.querySelector('#profileForm')?.addEventListener('submit',e=>{e.preventDefault();const name=document.querySelector('#newname').value.trim();if(name){s.user=name;save();alertMsg('Nome de exibição atualizado.')}});document.querySelector('#orderForm')?.addEventListener('submit',e=>{e.preventDefault();const c=contact(document.querySelector('#orderContact').value),p=products.find(x=>x.id===document.querySelector('#product').value),d=Number(document.querySelector('#discount').value),note=document.querySelector('#orderNote').value.trim();if(!c||!p||!Number.isFinite(d)||d<0||d>100||!note)return;const status=d>p.discount?'Aguardando aprovação':'Registrada';s.orders.push({id:Date.now(),at:new Date().toISOString(),contact:c.id,name:c.name,product:p.name,productId:p.id,discount:d,price:Math.round(p.price*(1-d/100)*100)/100,status,note});c.history.push({at:new Date().toISOString(),result:'Proposta '+status,note:`${p.name}: ${money(p.price*(1-d/100))}. ${note}`});c.status='Proposta enviada';save();alertMsg(`Proposta registrada (${status}).`)})}
render();
</script></body></html>
